{{intro}}
<section class="section"><div class="wrap">
  <div class="directory-toolbar"><label class="search-field"><span>Find an officer</span><input id="officerSearch" type="search" placeholder="Search by name or batch number" /></label><label class="sort-field"><span>Sort by</span><select id="officerSort"><option value="featured">Featured first</option><option value="number">Batch number</option><option value="name">Name A–Z</option></select></label></div>
  <div class="directory-summary"><p id="officerCount" class="result-count" aria-live="polite"></p><button id="officerReset" class="reset-button is-hidden" type="button">Clear search</button></div>
  <div class="officer-grid" id="officerGrid"></div><div class="center"><button class="text-button" id="officerMore" type="button">Show more officers</button></div>
  <noscript>{{officer_links}}</noscript>
</div></section>
